spring:
  application:
    name: prices

  datasource:
    url: jdbc:h2:mem:prices
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  sql:
    init:
      mode: always

  mvc:
    problemdetails:
      enabled: true

  h2:
    console:
      enabled: true
      path: /h2-console
